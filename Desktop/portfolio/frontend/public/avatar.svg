<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1538" />
      <stop offset="60%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="cyberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)" rx="200" />
  
  <!-- Cyber Grid Lines -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" />
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#cyberViolet)" stroke-width="2.5" opacity="0.8" filter="url(#glowFilter)" />

  <!-- Shoulders & Torso (Cyber Hoodie) -->
  <path d="M 90 380 C 95 310, 140 270, 200 270 C 260 270, 305 310, 310 380 Z" fill="#131b2e" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2" />
  <path d="M 155 272 L 200 340 L 245 272" fill="none" stroke="url(#cyberViolet)" stroke-width="2" />
  <path d="M 175 320 L 200 375 L 225 320" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="55" rx="6" fill="#c49a7a" />
  <path d="M 180 235 C 190 250, 210 250, 220 235" fill="none" stroke="#a3785a" stroke-width="2" />

  <!-- Head Base -->
  <path d="M 140 170 C 140 110, 260 110, 260 170 C 260 220, 235 245, 200 245 C 165 245, 140 220, 140 170 Z" fill="#d8a885" />
  
  <!-- Stylish Modern Hair -->
  <path d="M 135 155 C 130 115, 155 85, 200 80 C 245 85, 270 115, 265 155 C 255 125, 230 100, 195 102 C 160 105, 145 130, 135 155 Z" fill="#1a1c29" />
  <path d="M 142 120 C 165 85, 235 85, 258 120 C 240 95, 170 95, 142 120 Z" fill="#2d2845" />

  <!-- Ears -->
  <path d="M 136 170 C 130 160, 130 185, 138 185 Z" fill="#c49a7a" />
  <path d="M 264 170 C 270 160, 270 185, 262 185 Z" fill="#c49a7a" />

  <!-- Modern Cyber HUD Glasses -->
  <rect x="150" y="152" width="42" height="24" rx="5" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="2.5" />
  <rect x="208" y="152" width="42" height="24" rx="5" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="192" y1="162" x2="208" y2="162" stroke="#06b6d4" stroke-width="2.5" />
  <path d="M 152 160 L 188 160" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M 210 160 L 246 160" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Nose -->
  <path d="M 200 178 L 196 195 L 204 195" fill="none" stroke="#b08365" stroke-width="2" stroke-linecap="round" />

  <!-- Confident Smile -->
  <path d="M 185 212 C 192 220, 208 220, 215 212" fill="none" stroke="#875338" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cybernetic Circuit Marks on Cheek -->
  <path d="M 240 188 L 248 194 L 255 194" fill="none" stroke="url(#cyberViolet)" stroke-width="1.5" opacity="0.8" />
  <circle cx="255" cy="194" r="2" fill="#06b6d4" />

  <!-- Code Monogram Accent -->
  <text x="200" y="360" font-family="monospace" font-size="13" font-weight="bold" fill="#06b6d4" text-anchor="middle" letter-spacing="3">&lt;AG / DEV&gt;</text>
</svg>
